name: design-pattern-playground-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: design_pattern_playground
      POSTGRES_USER: design_pattern_playground
      POSTGRES_PASSWORD: design_pattern_playground
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U design_pattern_playground -d design_pattern_playground"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace
    command: ./mvnw spring-boot:run
    environment:
      MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/design_pattern_playground
      SPRING_DATASOURCE_USERNAME: design_pattern_playground
      SPRING_DATASOURCE_PASSWORD: design_pattern_playground
      SPRING_H2_CONSOLE_ENABLED: "false"
      APP_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./Backend:/workspace
      - backend_m2:/root/.m2

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_m2:
  frontend_node_modules:
  postgres_dev_data:
