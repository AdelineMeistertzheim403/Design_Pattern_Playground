spring.datasource.url=jdbc:h2:mem:design-pattern-playground-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.security.jwt.secret=design-pattern-playground-test-secret-design-pattern-playground
app.security.jwt.access-token-expiration-minutes=15
app.security.refresh-token.expiration-days=7
app.security.cookies.access-token-name=dpp_access_token
app.security.cookies.refresh-token-name=dpp_refresh_token
app.security.cookies.secure=false
app.security.cookies.same-site=Lax
app.security.cookies.domain=
