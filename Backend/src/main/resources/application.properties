spring.application.name=design-pattern-playground
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/design_pattern_playground}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:design_pattern_playground}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:design_pattern_playground}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.security.jwt.secret=${APP_JWT_SECRET:design-pattern-playground-dev-secret-design-pattern-playground}
app.security.jwt.access-token-expiration-minutes=15
app.security.refresh-token.expiration-days=7
app.security.cookies.access-token-name=${APP_ACCESS_TOKEN_COOKIE_NAME:dpp_access_token}
app.security.cookies.refresh-token-name=${APP_REFRESH_TOKEN_COOKIE_NAME:dpp_refresh_token}
app.security.cookies.secure=${APP_COOKIE_SECURE:false}
app.security.cookies.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.security.cookies.domain=${APP_COOKIE_DOMAIN:}
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
