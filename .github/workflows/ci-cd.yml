name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: design-pattern-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: Backend
        run: ./mvnw test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

  compose:
    name: Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry compose
        run: docker compose --env-file .env.prod.example -f compose.registry.yml config

      - name: Validate production compose
        run: docker compose --env-file .env.prod.example -f compose.prod.yml config

  publish:
    name: Publish Images To Private Registry
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - compose
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize registry configuration
        id: registry
        env:
          REGISTRY_HOST_RAW: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_NAMESPACE_RAW: ${{ secrets.REGISTRY_NAMESPACE }}
          REGISTRY_USERNAME_RAW: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          normalize_host() {
            printf '%s' "$1" | tr -d '\r' | sed -E 's#^[[:space:]]+##; s#[[:space:]]+$##; s#^https?://##; s#/$##'
          }

          normalize_value() {
            printf '%s' "$1" | tr -d '\r' | sed -E 's#^[[:space:]]+##; s#[[:space:]]+$##'
          }

          REGISTRY_HOST="$(normalize_host "$REGISTRY_HOST_RAW")"
          REGISTRY_NAMESPACE="$(normalize_value "$REGISTRY_NAMESPACE_RAW")"
          REGISTRY_USERNAME="$(normalize_value "$REGISTRY_USERNAME_RAW")"

          if [ -z "$REGISTRY_HOST" ] || [ -z "$REGISTRY_NAMESPACE" ] || [ -z "$REGISTRY_USERNAME" ]; then
            echo "Registry secrets are incomplete after normalization."
            exit 1
          fi

          printf 'host=%s\n' "$REGISTRY_HOST" >> "$GITHUB_OUTPUT"
          printf 'namespace=%s\n' "$REGISTRY_NAMESPACE" >> "$GITHUB_OUTPUT"
          printf 'username=%s\n' "$REGISTRY_USERNAME" >> "$GITHUB_OUTPUT"

      - name: Check registry endpoint
        run: |
          HEADERS_FILE="$(mktemp)"
          STATUS="$(curl -sS -D "$HEADERS_FILE" -o /dev/null -w '%{http_code}' "https://${{ steps.registry.outputs.host }}/v2/")"
          sed -n '1,20p' "$HEADERS_FILE"

          if grep -Eiq '^(server: cloudflare|cf-ray:)' "$HEADERS_FILE"; then
            echo "The registry host appears to be behind Cloudflare. Docker registry traffic must bypass the Cloudflare proxy."
            exit 1
          fi

          if [ "$STATUS" = "401" ] && ! grep -Eiq '^www-authenticate:' "$HEADERS_FILE"; then
            echo "The registry returned 401 without a WWW-Authenticate header. The reverse proxy is not forwarding the registry authentication flow correctly."
            exit 1
          fi

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "Unexpected registry status from https://${{ steps.registry.outputs.host }}/v2/: $STATUS"
            exit 1
          fi

      - name: Log in to private registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | tr -d '\r' | docker login "${{ steps.registry.outputs.host }}" -u "${{ steps.registry.outputs.username }}" --password-stdin

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.namespace }}/backend:${{ github.sha }}
            ${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.namespace }}/backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.namespace }}/frontend:${{ github.sha }}
            ${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.namespace }}/frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '\n' >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$VPS_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          printf '\n' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check VPS disk space before sync
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_DEPLOY_FREE_BUFFER_MB: ${{ vars.VPS_DEPLOY_FREE_BUFFER_MB }}
        run: |
          SSH_PORT="${VPS_SSH_PORT:-22}"
          BUFFER_MB="${VPS_DEPLOY_FREE_BUFFER_MB:-512}"

          ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "mkdir -p '$VPS_APP_DIR'"

          AVAILABLE_KB="$(ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "df -Pk '$VPS_APP_DIR' | awk 'NR==2 {print \$4}'")"
          if ! [[ "$AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
            echo "Unable to read free disk space on VPS for $VPS_APP_DIR."
            ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "df -h '$VPS_APP_DIR' || true"
            exit 1
          fi

          TRANSFER_BYTES="$(rsync -azn --delete --stats \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".codex" \
            --exclude "Backend/target/" \
            --exclude "Frontend/node_modules/" \
            --exclude "Frontend/dist/" \
            --exclude ".env" \
            --exclude "ops/registry/auth/" \
            -e "ssh -p $SSH_PORT" \
            ./ "$VPS_SSH_USER@$VPS_SSH_HOST:$VPS_APP_DIR/" | awk -F': ' '/Total transferred file size:/ {gsub(/,/, "", $2); print $2}')"

          if ! [[ "$TRANSFER_BYTES" =~ ^[0-9]+$ ]]; then
            echo "Unable to estimate rsync transfer size."
            exit 1
          fi

          AVAILABLE_BYTES=$((AVAILABLE_KB * 1024))
          BUFFER_BYTES=$((BUFFER_MB * 1024 * 1024))
          REQUIRED_BYTES=$((TRANSFER_BYTES + BUFFER_BYTES))

          echo "Estimated transfer size: $TRANSFER_BYTES bytes"
          echo "Required free space with buffer: $REQUIRED_BYTES bytes"
          echo "Available free space on VPS: $AVAILABLE_BYTES bytes"

          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "Insufficient free disk space on VPS before deployment."
            echo "Need at least ${BUFFER_MB} MB buffer in addition to the incoming sync."
            ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "df -h '$VPS_APP_DIR'; du -sh '$VPS_APP_DIR' 2>/dev/null || true"
            exit 1
          fi

      - name: Sync project to VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          SSH_PORT="${VPS_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "mkdir -p '$VPS_APP_DIR'"
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".codex" \
            --exclude "Backend/target/" \
            --exclude "Frontend/node_modules/" \
            --exclude "Frontend/dist/" \
            --exclude ".env" \
            --exclude "ops/registry/auth/" \
            -e "ssh -p $SSH_PORT" \
            ./ "$VPS_SSH_USER@$VPS_SSH_HOST:$VPS_APP_DIR/"

      - name: Upload production environment file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          SSH_PORT="${VPS_SSH_PORT:-22}"
          printf '%s' "$PROD_ENV_FILE" | tr -d '\r' | ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "cat > '$VPS_APP_DIR/.env' && printf '\n' >> '$VPS_APP_DIR/.env'"

      - name: Deploy application on VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          SSH_PORT="${VPS_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_HOST" "cd '$VPS_APP_DIR' && chmod +x scripts/deploy_prod.sh scripts/deploy_registry.sh scripts/setup_registry_auth.sh && APP_IMAGE_TAG='${{ github.sha }}' ./scripts/deploy_prod.sh"
