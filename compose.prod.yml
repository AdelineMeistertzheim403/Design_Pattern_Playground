name: design-pattern-playground-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-design_pattern_playground}
      POSTGRES_USER: ${POSTGRES_USER:-design_pattern_playground}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-design_pattern_playground} -d ${POSTGRES_DB:-design_pattern_playground}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5-standalone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-18080}:8080"

  backend:
    image: ${REGISTRY_HOST}/${REGISTRY_NAMESPACE:-design-pattern-playground}/backend:${APP_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-design_pattern_playground}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-design_pattern_playground}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_H2_CONSOLE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-traefik-public}"
      - "traefik.http.routers.design-pattern-playground-backend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.design-pattern-playground-backend.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.design-pattern-playground-backend.priority=100"
      - "traefik.http.routers.design-pattern-playground-backend.tls=true"
      - "traefik.http.routers.design-pattern-playground-backend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.design-pattern-playground-backend.loadbalancer.server.port=8080"

  frontend:
    image: ${REGISTRY_HOST}/${REGISTRY_NAMESPACE:-design-pattern-playground}/frontend:${APP_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK:-traefik-public}"
      - "traefik.http.routers.design-pattern-playground-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.design-pattern-playground-frontend.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.design-pattern-playground-frontend.priority=1"
      - "traefik.http.routers.design-pattern-playground-frontend.tls=true"
      - "traefik.http.routers.design-pattern-playground-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.design-pattern-playground-frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_PUBLIC_NETWORK:-traefik-public}
